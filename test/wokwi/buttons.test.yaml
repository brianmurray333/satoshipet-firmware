name: Satoshi Pet button input
version: 1
author: Satoshi Pet
steps:
  - wait-serial: "Setup complete!"
  - set-control:
      part-id: externalButton
      control: pressed
      value: 1
  - delay: 150ms
  - set-control:
      part-id: externalButton
      control: pressed
      value: 0
  - wait-serial: "External button pressed"
  - wait-serial: "Button released"
