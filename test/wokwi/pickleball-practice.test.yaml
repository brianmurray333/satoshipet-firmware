name: Pickleball single-player practice
version: 1
author: Satoshi Pet
steps:
  - wait-serial: "Setup complete!"

  # Open the main menu and move from Home to Play.
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 250ms
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 250ms

  # Hold Play, select Pickle Practice, then hold to launch it.
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 1s
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 300ms
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 250ms
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 1s
  - set-control: { part-id: externalButton, control: pressed, value: 0 }

  - wait-serial: "Starting Pickleball Practice!"
  - wait-serial: "Pickleball practice complete!"
