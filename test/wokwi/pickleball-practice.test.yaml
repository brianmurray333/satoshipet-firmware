name: Pickleball solo (rally streak)
version: 1
author: Satoshi Pet
steps:
  - wait-serial: "Setup complete!"

  # Open the main menu and move from Home to Play.
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 250ms
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 250ms

  # Hold Play, select Pickleball, hold it, then hold Solo (first item).
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 1s
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 300ms
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 150ms
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 250ms
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 1s
  - set-control: { part-id: externalButton, control: pressed, value: 0 }
  - delay: 300ms
  - set-control: { part-id: externalButton, control: pressed, value: 1 }
  - delay: 1s
  - set-control: { part-id: externalButton, control: pressed, value: 0 }

  # No presses: the first ball is missed and the rally ends at 0.
  - wait-serial: "Starting Pickleball solo (rally streak)"
  - wait-serial: "Pickleball rally over: 0 returns"
