[platformio]
src_dir = satoshi_pet_heltec

[env:heltec_wifi_kit_32_v3]
platform = espressif32
board = heltec_wifi_kit_32_V3
framework = arduino
monitor_speed = 115200
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.3
  eiannone/Heltec_Esp32_Display@^0.1.0
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:wokwi]
extends = env:heltec_wifi_kit_32_v3
; Wokwi exposes the ESP32-S3 UART in its terminal. The physical Heltec build
; uses native USB CDC instead, so keep the simulator as a separate target.
build_flags =
  -D WOKWI_SIMULATOR=1
